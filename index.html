// Calcula el precio (sin ISV) de un ítem del catálogo según la fórmula vigente.
// Si el ítem tiene precioManual (fijado por el gerente), ese manda y se ignora la fórmula.
function precioDeItem(item, config) {
  if (item.precioManual != null && item.precioManual !== "") return Number(item.precioManual);
  const costo = Number(item.costoUSD) || 0;
  const mult = item.cat === "Accesorio" ? config.multAccesorio : config.multEquipo;
  return costo * mult * config.tipoCambio;
}

// Arma un paquete inteligente: elige, dentro de las categorías del área y SOLO entre equipos
// que la empresa ofrece (ofrecido !== false), el mejor equipo de cada categoría según el nivel.
// nivel: "esencial" (más económico) | "recomendado" (intermedio) | "premium" (tope de gama).
// A los ultrasonidos les añade automáticamente su transductor recomendado.
function armarPaquete(catalogo, config, areaNombre, nivel) {
  const area = AREAS_PAQUETE[areaNombre];
  if (!area) return [];
  const ofrecidos = catalogo.filter(e => e.ofrecido !== false);
  const items = [];
  area.cats.forEach(cat => {
    const enCat = ofrecidos.filter(e => e.cat === cat && !e.esTransductor);
    if (!enCat.length) return;
    // ordenar por precio calculado
    const ordenados = [...enCat].sort((a, b) => precioDeItem(a, config) - precioDeItem(b, config));
    let elegido;
    if (nivel === "esencial") elegido = ordenados[0];else if (nivel === "premium") elegido = ordenados[ordenados.length - 1];else elegido = ordenados[Math.floor((ordenados.length - 1) / 2)]; // recomendado: intermedio

    if (elegido) {
      const fotos = elegido.fotos && elegido.fotos.length ? elegido.fotos : elegido.foto ? [elegido.foto] : [];
      items.push({
        id: 0,
        sku: elegido.sku,
        desc: elegido.nombre,
        cant: 1,
        precio: precioDeItem(elegido, config),
        foto: fotos[0] || null,
        fotos,
        descripcion: elegido.descripcion || "",
        esUltrasonido: !!elegido.esUltrasonido,
        esTransductor: false
      });
      // Si es ultrasonido, agregar su transductor recomendado (según nivel)
      if (elegido.esUltrasonido && elegido.complementos) {
        const trans = elegido.complementos.filter(x => x.tipo === "Transductor");
        if (trans.length) {
          const tOrd = [...trans].sort((a, b) => a.costoUSD - b.costoUSD);
          const t = nivel === "premium" ? tOrd[tOrd.length - 1] : nivel === "esencial" ? tOrd[0] : tOrd[Math.floor((tOrd.length - 1) / 2)];
          items.push({
            id: 0,
            desc: t.nombre,
            cant: 1,
            precio: t.costoUSD * config.multAccesorio * config.tipoCambio,
            foto: null,
            fotos: [],
            descripcion: "",
            esTransductor: true,
            cat: "Accesorio"
          });
        }
      }
    }
  });
  return items;
}

function pasosDeVenta(c) {
  const contado = c.pago === "Contado";
  if (contado) return ["cotizacion", "entrega"];
  const nuevo = c.clienteNuevo;
  return nuevo ? ["cotizacion", "propuesta", "financiamiento", "contrato", "entrega"] : ["cotizacion", "propuesta", "contrato", "entrega"];
}

// El paso "cotización" se considera cumplido cuando la venta fue aceptada por el cliente.
function pasoActual(c) {
  const pasos = pasosDeVenta(c);
  const done = c.pasosCompletados || {};
  // primer paso no completado
  for (let i = 0; i < pasos.length; i++) {
    if (!done[pasos[i]]) return {
      pasos,
      idx: i,
      actual: pasos[i],
      done
    };
  }
  return {
    pasos,
    idx: pasos.length,
    actual: null,
    done
  }; // todo completo
}

// ---- FINANCIAMIENTO (interés plano) ----
// Interés según el plazo (INTERES_POR_PLAZO). Prima 50%, 30% o sin prima
// (sin prima solo si total <= TOPE_SIN_PRIMA). El interés se aplica al saldo financiado.
function calcularCuotas(montoTotal, primaPct, meses, interesPct, fechaPrimera) {
  // El interés lo determina el plazo; si no viene, se toma de la tabla
  const pct = interesPct != null ? interesPct : INTERES_POR_PLAZO[meses] || 0;
  const prima = montoTotal * (primaPct / 100);
  const saldo = montoTotal - prima;
  const interes = saldo * (pct / 100);
  const aFinanciar = saldo + interes;
  const montoCuota = aFinanciar / meses;
  const cuotas = [];
  const base = fechaPrimera ? new Date(fechaPrimera) : new Date();
  for (let i = 0; i < meses; i++) {
    const f = new Date(base);
    f.setMonth(f.getMonth() + i);
    cuotas.push({
      n: i + 1,
      fecha: f.toISOString().slice(0, 10),
      monto: montoCuota,
      pagada: false,
      fechaPago: null
    });
  }
  return {
    prima,
    saldo,
    interes,
    interesPct: pct,
    aFinanciar,
    montoCuota,
    cuotas
  };
}
